<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta</title>
    <link rel="stylesheet" href="auth.css">
</head>

<body class="register-body">

    <form action="register.php" method="POST">

        <h2>Crear cuenta</h2>

        <input
            type="text"
            name="username"
            placeholder="Usuario"
            maxlength="50"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Contraseña"
            minlength="6"
            required
        >

        <button type="submit">
            Registrar
        </button>

        <a href="login.html" class="btn-login">
            Ya tengo una cuenta
        </a>

    </form>

</body>

</html>
